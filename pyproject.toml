[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopee-agent"
version = "0.1.0"
description = "MCP server + CLI agar Claude bisa mengelola toko Shopee (produk, SEO massal, flash sale)"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "python-dotenv>=1.0", "mcp>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shopee-agent = "shopee_agent.cli:main"
shopee-agent-mcp = "shopee_agent.mcp_server:main"

[tool.setuptools]
packages = ["shopee_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
